        .section-header {
            background: linear-gradient(135deg, #5e35b1, #7e57c2);

        }
        .info-box {

            border-left: 4px solid #ff9800;

        }
        .score-display {
            text-align: center;
            padding: 20px;

        .grade-result {
            display: none;

        @media (max-width: 600px) {

<body>
    <div class="header">
        <h1>ACCT 302 - Cost Accounting</h1>
        <p><strong>Practice Exam Final</strong></p>
        <p>Chapters 12, 14, 16, 18</p>
    </div>
    
    <div class="controls">
        <button class="refresh-btn" onclick="generateExam()">🔄 New Exam (Shuffle & Randomize)</button>
        <button class="show-answers-btn" onclick="toggleAnswers()">📝 Show/Hide Answers</button>
    </div>
    
    <div class="score-display" id="scoreDisplay">
        <div class="score-number" id="scoreNumber">0/24</div>
        <p>Questions Answered Correctly</p>
    </div>
    
    <div id="examContent"></div>

    <script>
        let answersVisible = false;
        let currentExamData = {};
        
        // Utility functions
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        function randChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }
        
        function formatCurrency(num) {
            if (num < 0) {
                return '-$' + Math.abs(num).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
            }
            return '$' + num.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
        }
        
        function formatNumber(num) {
            return num.toLocaleString();
        }
        
        function formatPercent(num, decimals = 2) {
            return num.toFixed(decimals) + '%';
        }

        // Question generators
        const questions = [
            // Q1 - Conceptual (Special Order)
            {
                type: 'conceptual',
                generate: function() {
                    const options = [
                        { text: "incremental revenues exceed incremental costs", correct: true },
                        { text: "additional fixed costs are incurred to accommodate the order", correct: false },
                        { text: "the company placing the order is in the same market segment as your current customers", correct: false },
                        { text: "incremental revenue equals incremental operating income", correct: false }
                    ];
                    return {
                        question: "When there is excess capacity, it makes sense to accept a one-time-only special order for less than the current selling price if:",
                        options: shuffle(options),
                        explanation: "A special order should be accepted when incremental revenues exceed incremental costs, as this will increase overall operating income."
                    };
                }
            },
            // Q2 - Conceptual (Relevant Costs)
            {
                type: 'conceptual',
                generate: function() {
                    const options = [
                        { text: "They are sunk costs and historical revenues.", correct: true },
                        { text: "They are expected costs and expected revenues.", correct: false },
                        { text: "They occur in the future.", correct: false },
                        { text: "They differ among alternative courses of action.", correct: false }
                    ];
                    return {
                        question: "Which of the following is NOT true with regards to relevant costs and relevant revenues?",
                        options: shuffle(options),
                        explanation: "Relevant costs are NOT sunk costs. Sunk costs have already been incurred and cannot be changed by any decision. Relevant costs are future costs that differ among alternatives."
                    };
                }
            },
            // Q3 - Conceptual (Theory of Constraints)
            {
                type: 'conceptual',
                generate: function() {
                    const options = [
                        { text: "the sum of material costs in direct and indirect materials, work-in-process, and finished goods inventories; R&D costs; and business function costs", correct: false },
                        { text: "the sum of material costs in direct materials, work-in-process, and finished goods inventories; R&D costs; and capital costs of equipment and buildings", correct: true },
                        { text: "the sum of material costs in direct and indirect materials, work-in-process, and finished goods inventories; R&D costs; and full costs", correct: false },
                        { text: "the sum of material costs in direct materials, work-in-process, and finished goods inventories; R&D costs; sunk costs, full costs, and business function costs", correct: false }
                    ];
                    return {
                        question: "Based on the theory of constraints, investments equal:",
                        options: shuffle(options),
                        explanation: "Under TOC, investments include material costs in direct materials, WIP, and finished goods inventories, plus R&D costs and capital costs of equipment and buildings."
                    };
                }
            },
            // Q4 - Calculation (Special Order Minimum Price)
            {
                type: 'calculation',
                generate: function() {
                    const directMaterials = randInt(100, 140);
                    const directLabor = randInt(80, 110);
                    const varMfgSupport = randInt(140, 170);
                    const varMarketing = randInt(65, 85);
                    const fixedMfgSupport = randInt(160, 190);
                    const fixedMarketing = randInt(55, 75);
                    const markupPercent = randInt(40, 50);
                    
                    const totalVariableCosts = directMaterials + directLabor + varMfgSupport + varMarketing;
                    const totalFixedCosts = fixedMfgSupport + fixedMarketing;
                    const totalCosts = totalVariableCosts + totalFixedCosts;
                    const markup = Math.round(totalCosts * markupPercent / 100);
                    const targetPrice = totalCosts + markup;
                    
                    // Minimum acceptable price = all variable costs
                    const minPrice = totalVariableCosts;
                    
                    const options = [
                        { text: formatCurrency(minPrice), correct: true },
                        { text: formatCurrency(markup), correct: false },
                        { text: formatCurrency(directMaterials + directLabor + varMfgSupport), correct: false },
                        { text: formatCurrency(totalCosts), correct: false }
                    ];
                    
                    return {
                        question: `Red Rose Manufacturers Inc. is approached by a potential customer to fulfill a one-time-only special order for a product similar to one offered to domestic customers. The company has excess capacity. The following per unit data apply for sales to regular customers:<br><br>
                        <table class="data-table">
                            <tr><th colspan="2">Variable costs:</th></tr>
                            <tr><td>Direct materials</td><td>${formatCurrency(directMaterials)}</td></tr>
                            <tr><td>Direct labor</td><td>${formatCurrency(directLabor)}</td></tr>
                            <tr><td>Manufacturing support</td><td>${formatCurrency(varMfgSupport)}</td></tr>
                            <tr><td>Marketing costs</td><td>${formatCurrency(varMarketing)}</td></tr>
                            <tr><th colspan="2">Fixed costs:</th></tr>
                            <tr><td>Manufacturing support</td><td>${formatCurrency(fixedMfgSupport)}</td></tr>
                            <tr><td>Marketing costs</td><td>${formatCurrency(fixedMarketing)}</td></tr>
                            <tr><td><strong>Total costs</strong></td><td><strong>${formatCurrency(totalCosts)}</strong></td></tr>
                            <tr><td>Markup (${markupPercent}%)</td><td>${formatCurrency(markup)}</td></tr>
                            <tr><td><strong>Targeted selling price</strong></td><td><strong>${formatCurrency(targetPrice)}</strong></td></tr>
                        </table>
                        For Red Rose Manufacturers Inc., what is the minimum acceptable price of this special order?`,
                        options: shuffle(options),
                        explanation: `Minimum acceptable price = All variable costs<br>
                        = ${formatCurrency(directMaterials)} + ${formatCurrency(directLabor)} + ${formatCurrency(varMfgSupport)} + ${formatCurrency(varMarketing)}<br>
                        = <strong>${formatCurrency(minPrice)}</strong>`
                    };
                }
            },
            // Q5 - Calculation (Make or Buy)
            {
                type: 'calculation',
                generate: function() {
                    const directMaterials = randInt(50, 60);
                    const directLabor = randInt(30, 40);
                    const variableOH = randInt(35, 45);
                    const fixedOH = randInt(30, 40);
                    const units = randInt(5, 8) * 1000;
                    const buyPrice = randInt(140, 150);
                    const eliminatedFixedOH = randInt(80, 100) * 1000;
                    
                    const variableCostPerUnit = directMaterials + directLabor + variableOH;
                    const totalCostPerUnit = variableCostPerUnit + fixedOH;
                    
                    const costToBuy = units * buyPrice;
                    const costToMake = (variableCostPerUnit * units) + eliminatedFixedOH;
                    const difference = Math.abs(costToBuy - costToMake);
                    
                    let decision, savings;
                    if (costToMake < costToBuy) {
                        decision = "Make";
                        savings = costToBuy - costToMake;
                    } else {
                        decision = "Buy";
                        savings = costToMake - costToBuy;
                    }
                    
                    const options = [
                        { text: `Buy; savings = ${formatCurrency(eliminatedFixedOH)}`, correct: false },
                        { text: `Buy; savings = ${formatCurrency(savings + randInt(5, 10) * 1000)}`, correct: false },
                        { text: `${decision}; savings = ${formatCurrency(savings)}`, correct: true },
                        { text: `${decision === "Make" ? "Buy" : "Make"}; savings = ${formatCurrency(savings + randInt(100, 200) * 1000)}`, correct: false }
                    ];
                    
                    return {
                        question: `Rubium Micro Devices currently manufactures a subassembly for its main product. The costs per unit are as follows:<br><br>
                        <table class="data-table">
                            <tr><td>Direct materials</td><td>${formatCurrency(directMaterials)}</td></tr>
                            <tr><td>Direct labor</td><td>${formatCurrency(directLabor)}</td></tr>
                            <tr><td>Variable overhead</td><td>${formatCurrency(variableOH)}</td></tr>
                            <tr><td>Fixed overhead</td><td>${formatCurrency(fixedOH)}</td></tr>
                            <tr><td><strong>Total</strong></td><td><strong>${formatCurrency(totalCostPerUnit)}</strong></td></tr>
                        </table>
                        Crayola Technologies Inc. has contacted Rubium with an offer to sell ${formatNumber(units)} of the subassemblies for ${formatCurrency(buyPrice)} each. Rubium will eliminate ${formatCurrency(eliminatedFixedOH)} of fixed overhead if it accepts the proposal. Should Rubium make or buy the subassemblies? What is the difference between the two alternatives?`,
                        options: shuffle(options),
                        explanation: `Cost to buy: ${formatNumber(units)} × ${formatCurrency(buyPrice)} = ${formatCurrency(costToBuy)}<br>
                        Cost to make: [(${formatCurrency(directMaterials)} + ${formatCurrency(directLabor)} + ${formatCurrency(variableOH)}) × ${formatNumber(units)}] + ${formatCurrency(eliminatedFixedOH)}<br>
                        = [${formatCurrency(variableCostPerUnit)} × ${formatNumber(units)}] + ${formatCurrency(eliminatedFixedOH)}<br>
                        = ${formatCurrency(variableCostPerUnit * units)} + ${formatCurrency(eliminatedFixedOH)} = ${formatCurrency(costToMake)}<br><br>
                        <strong>${decision}</strong> the subassemblies; savings = ${formatCurrency(savings)}`
                    };
                }
            },
            // Q6 - Calculation (Drop Product Line)
            {
                type: 'calculation',
                generate: function() {
                    const salesA = randInt(55, 65) * 1000;
                    const salesB = randInt(90, 105) * 1000;
                    const salesC = randInt(20, 28) * 1000;
                    
                    const varCostsA = randInt(35, 42) * 1000;
                    const varCostsB = randInt(48, 58) * 1000;
                    const varCostsC = randInt(10, 15) * 1000;
                    
                    const cmA = salesA - varCostsA;
                    const cmB = salesB - varCostsB;
                    const cmC = salesC - varCostsC;
                    
                    const avoidableA = randInt(5, 8) * 1000;
                    const avoidableB = randInt(17, 22) * 1000;
                    const avoidableC = randInt(4, 6) * 1000;
                    
                    const unavoidableA = randInt(9, 13) * 1000;
                    const unavoidableB = randInt(10, 14) * 1000;
                    const unavoidableC = randInt(8, 11) * 1000;
                    
                    const opIncomeA = cmA - avoidableA - unavoidableA;
                    const opIncomeB = cmB - avoidableB - unavoidableB;
                    const opIncomeC = cmC - avoidableC - unavoidableC;
                    
                    // Impact of dropping C: lose CM, save avoidable fixed costs
                    const impactOfDroppingC = avoidableC - cmC;
                    
                    let effectText;
                    if (impactOfDroppingC > 0) {
                        effectText = `increase by ${formatCurrency(impactOfDroppingC)}`;
                    } else {
                        effectText = `decrease by ${formatCurrency(Math.abs(impactOfDroppingC))}`;
                    }
                    
                    const options = [
                        { text: `increase by ${formatCurrency(Math.abs(opIncomeC))}`, correct: false },
                        { text: `increase by ${formatCurrency(avoidableC)}`, correct: false },
                        { text: `decrease by ${formatCurrency(Math.abs(impactOfDroppingC))}`, correct: impactOfDroppingC < 0 },
                        { text: `decrease by ${formatCurrency(cmC + avoidableC)}`, correct: false }
                    ];
                    
                    // Make sure correct answer is in options
                    if (impactOfDroppingC >= 0) {
                        options[2] = { text: `increase by ${formatCurrency(impactOfDroppingC)}`, correct: true };
                        options[0] = { text: `decrease by ${formatCurrency(cmC)}`, correct: false };
                    }
                    
                    return {
                        question: `Giant Company has three products, A, B, and C. The following information is available:<br><br>
                        <table class="data-table">
                            <tr><th></th><th>Product A</th><th>Product B</th><th>Product C</th></tr>
                            <tr><td>Sales</td><td>${formatCurrency(salesA)}</td><td>${formatCurrency(salesB)}</td><td>${formatCurrency(salesC)}</td></tr>
                            <tr><td>Variable costs</td><td>${formatCurrency(varCostsA)}</td><td>${formatCurrency(varCostsB)}</td><td>${formatCurrency(varCostsC)}</td></tr>
                            <tr><td>Contribution margin</td><td>${formatCurrency(cmA)}</td><td>${formatCurrency(cmB)}</td><td>${formatCurrency(cmC)}</td></tr>
                            <tr><td>Fixed costs: Avoidable</td><td>${formatCurrency(avoidableA)}</td><td>${formatCurrency(avoidableB)}</td><td>${formatCurrency(avoidableC)}</td></tr>
                            <tr><td>Fixed costs: Unavoidable</td><td>${formatCurrency(unavoidableA)}</td><td>${formatCurrency(unavoidableB)}</td><td>${formatCurrency(unavoidableC)}</td></tr>
                            <tr><td><strong>Operating income</strong></td><td><strong>${formatCurrency(opIncomeA)}</strong></td><td><strong>${formatCurrency(opIncomeB)}</strong></td><td><strong>${formatCurrency(opIncomeC)}</strong></td></tr>
                        </table>
                        Giant Company is thinking of dropping Product C because it is reporting a loss. Assuming Giant drops Product C and does NOT replace it, operating income will:`,
                        options: shuffle(options),
                        explanation: `Dropping Product C means Giant gives up ${formatCurrency(cmC)} in contribution margin while only saving ${formatCurrency(avoidableC)} in avoidable fixed costs.<br><br>
                        Impact = Avoidable costs saved - Contribution margin lost<br>
                        = ${formatCurrency(avoidableC)} - ${formatCurrency(cmC)} = ${formatCurrency(impactOfDroppingC)}<br><br>
                        Operating income would <strong>${effectText}</strong>.`
                    };
                }
            },
            // Q7 - Conceptual (Pricing)
            {
                type: 'conceptual',
                generate: function() {
                    const options = [
                        { text: "deter a customer from purchasing a product and seek alternatives", correct: true },
                        { text: "increase demand and demand for the product", correct: false },
                        { text: "indicate supply is too plentiful", correct: false },
                        { text: "decrease a competitor's market share", correct: false }
                    ];
                    return {
                        question: "In setting prices for products and services, managers may attempt to charge what the customer is willing to pay however, too high a price may:",
                        options: shuffle(options),
                        explanation: "Setting a price too high will deter customers from purchasing the product, causing them to seek alternatives from competitors or substitute products."
                    };
                }
            },
            // Q8 - Conceptual (Customer Life-Cycle Costs)
            {
                type: 'conceptual',
                generate: function() {
                    const options = [
                        { text: "costs incurred by the selling company to satisfy the customer", correct: false },
                        { text: "costs to the customers for buying and using a product", correct: true },
                        { text: "same as the selling life-cycle prices", correct: false },
                        { text: "replacement costs of using a product or service", correct: false }
                    ];
                    return {
                        question: "Which of the following best describes customer life-cycle costs?",
                        options: shuffle(options),
                        explanation: "Customer life-cycle costs are the total costs incurred by customers for buying and using a product over its useful life, including purchase price, operating costs, maintenance, and disposal."
                    };
                }
            },
            // Q9 - Conceptual (Predatory Pricing)
            {
                type: 'conceptual',
                generate: function() {
                    const options = [
                        { text: "allows prices to be cut to the level of variable costs", correct: false },
                        { text: "deliberately sets prices very low, sometimes even below costs, to minimize competition", correct: true },
                        { text: "is required when a company declares bankruptcy so that it can sell its remaining goods quickly", correct: false },
                        { text: "is used in the food industry for perishable goods", correct: false }
                    ];
                    return {
                        question: "Predatory pricing is a type of price discrimination that:",
                        options: shuffle(options),
                        explanation: "Predatory pricing deliberately sets prices very low (sometimes below cost) to drive competitors out of the market or prevent new competitors from entering."
                    };
                }
            },
            // Q10 - Calculation (Target Cost)
            {
                type: 'calculation',
                generate: function() {
                    const currentPrice = randInt(550, 620);
                    const newPrice = currentPrice - randInt(90, 110);
                    const targetUnits = randInt(250, 320);
                    const targetProfitPercent = randInt(25, 35);
                    
                    const targetRevenue = newPrice * targetUnits;
                    const targetProfit = targetRevenue * (targetProfitPercent / 100);
                    const targetCostPerUnit = newPrice - (newPrice * targetProfitPercent / 100);
                    
                    const options = [
                        { text: formatCurrency(newPrice * (1 + targetProfitPercent / 100)), correct: false },
                        { text: formatCurrency(targetCostPerUnit), correct: true },
                        { text: formatCurrency(newPrice), correct: false },
                        { text: formatCurrency(newPrice - targetCostPerUnit), correct: false }
                    ];
                    
                    return {
                        question: `Sales of Granite City Products Inc. have been on a steady decline for the last 12 months. A market research study conducted revealed that the product of Granite City Products Inc. can be sold only for ${formatCurrency(newPrice)} as opposed to the current market price charged of ${formatCurrency(currentPrice)} per unit. Granite City Products Inc. has decided to revise its sales price to ${formatCurrency(newPrice)}. The annual sales target volume of the product after price revision is ${formatNumber(targetUnits)} units. Granite City Products Inc. wants to earn ${targetProfitPercent}% on its sales amount.<br><br>
                        What is the target cost per unit?`,

                    const varSGA = randInt(2, 4) + 0.75;
                    const fixedSGA = randInt(7, 10);
                    const normalSellingPrice = randInt(68, 75) + 0.60;
                    
                    const specialOrderUnits = randInt(1200, 1800);
                    const sgaReduction = 0.75;
                    const specialPrice = randInt(43, 48) + 0.40;
                    
                    // Calculate variable cost per unit on normal sales
                    const normalVarCost = directMaterials + directLabor + varMfgOH + varSGA;
                    
                    // Variable cost per unit on special order (reduced SGA)
                    const specialVarCost = directMaterials + directLabor + varMfgOH + (varSGA - sgaReduction);
                    
                    // Contribution margin on special order
                    const specialCM = specialPrice - specialVarCost;
                    
                    // Total impact
                    const totalImpact = specialCM * specialOrderUnits;
                    
                    return {
                        question: `<strong>Question 25:</strong> Castleton Products Inc. produces a single product. The cost of producing and selling a single unit of this product at the company's normal activity level of ${formatNumber(normalUnits)} units per month is as follows:<br><br>
                        <table class="data-table">
                            <tr><td>Direct materials</td><td>${formatCurrency(directMaterials)}</td></tr>
                            <tr><td>Direct labor</td><td>${formatCurrency(directLabor)}</td></tr>
                            <tr><td>Variable manufacturing overhead</td><td>${formatCurrency(varMfgOH)}</td></tr>
                            <tr><td>Fixed manufacturing overhead</td><td>${formatCurrency(fixedMfgOH)}</td></tr>
                            <tr><td>Variable selling & administrative expense</td><td>${formatCurrency(varSGA)}</td></tr>
                            <tr><td>Fixed selling & administrative expense</td><td>${formatCurrency(fixedSGA)}</td></tr>
                        </table>
                        The normal selling price of the product is ${formatCurrency(normalSellingPrice)} per unit.<br><br>
                        An order has been received from an overseas customer for ${formatNumber(specialOrderUnits)} units to be delivered this month at a special discounted price. This order would have no effect on the company's normal sales and would not change the total amount of the company's fixed costs. The variable selling and administrative expense would be ${formatCurrency(sgaReduction)} less per unit on this order than on normal sales.<br><br>
                        Direct labor is a variable cost in this company.<br><br>
                        Suppose there is enough idle capacity to produce the units required by the overseas customer and the special discounted price on the special order is ${formatCurrency(specialPrice)} per unit. By how much would this special order increase (decrease) the company's net operating income for the month?<br><br>
                        <strong>Your Answer:______________</strong>`,
                        answer: `<strong>Variable cost per unit on normal sales:</strong><br>
                        <table class="data-table">
                            <tr><td>Direct materials</td><td>${formatCurrency(directMaterials)}</td></tr>
                            <tr><td>Direct labor</td><td>${formatCurrency(directLabor)}</td></tr>
                            <tr><td>Variable manufacturing overhead</td><td>${formatCurrency(varMfgOH)}</td></tr>
                            <tr><td>Variable selling & administrative expense</td><td>${formatCurrency(varSGA)}</td></tr>
                            <tr><td><strong>Variable cost per unit on normal sales</strong></td><td><strong>${formatCurrency(normalVarCost)}</strong></td></tr>
                        </table><br>
                        
                        <strong>Variable cost per unit on special order:</strong><br>
                        <table class="data-table">
                            <tr><td>Normal variable cost per unit</td><td>${formatCurrency(normalVarCost)}</td></tr>
                            <tr><td>Reduction in variable selling and administrative expense</td><td>(${formatCurrency(sgaReduction)})</td></tr>
                            <tr><td><strong>Variable cost per unit on special order</strong></td><td><strong>${formatCurrency(specialVarCost)}</strong></td></tr>
                        </table><br>
                        
                        <strong>Impact on net operating income:</strong><br>
                        <table class="data-table">
                            <tr><td>Selling price for special order</td><td>${formatCurrency(specialPrice)}</td></tr>
                            <tr><td>Variable cost per unit on special order</td><td>${formatCurrency(specialVarCost)}</td></tr>
                            <tr><td><strong>Unit contribution margin on special order</strong></td><td><strong>${formatCurrency(specialCM)}</strong></td></tr>
                            <tr><td>Number of units in special order</td><td>× ${formatNumber(specialOrderUnits)}</td></tr>
                            <tr><td><strong>Increase (decrease) in net operating income</strong></td><td><strong>${formatCurrency(totalImpact)} ${totalImpact >= 0 ? 'Increase' : 'Decrease'}</strong></td></tr>
                        </table>`
                    };
                }
            },
            // Q26 - Short Answer (Target Cost)
            {
                type: 'short_answer_calc',
                generate: function() {
                    const currentPrice = randInt(120, 135);
                    const currentCost = randInt(85, 95);
                    const competitorPrice = currentPrice - randInt(8, 15);
                    const newPrice = competitorPrice - randInt(3, 8);
                    const currentSalesVolume = randInt(180, 220) * 1000;
                    const targetProfitPct = randInt(22, 28);
                    
                    // Part a: Target cost with profit as % of sales
                    const targetCostA = newPrice * (1 - targetProfitPct / 100);
                    
                    // Part b: Target cost to maintain same income level
                    const currentIncome = currentSalesVolume * (currentPrice - currentCost);
                    const newRevenue = currentSalesVolume * newPrice;
                    const targetCostB = (newRevenue - currentIncome) / currentSalesVolume;
                    
                    return {
                        question: `<strong>Question 26:</strong> Fairhaven Composite Poles manufactures fishing poles that have a price of ${formatCurrency(currentPrice)}. It has costs of ${formatCurrency(currentCost)}. A competitor is introducing a new fishing pole that will sell for ${formatCurrency(competitorPrice)}. Management believes it must lower the price to ${formatCurrency(newPrice)} to compete in the highly cost-conscious fishing pole market. Marketing department believes that the new price will allow the company to maintain the current sales level of ${formatNumber(currentSalesVolume)} poles per year.<br><br>
                        <strong>a. What is the target cost for the new price if target operating income is ${targetProfitPct}% of sales?</strong><br>
                        Your Answer:______________<br><br>
                        <strong>b. What is the target cost per unit if the selling price is reduced to ${formatCurrency(newPrice)} and the company wants to maintain its same income level?</strong><br>
                        Your Answer:______________`,
                        answer: `<strong>a. Target cost with ${targetProfitPct}% profit margin:</strong><br>
                        Target cost = Selling price - Target profit<br>
                        Target cost = ${formatCurrency(newPrice)} - (${formatCurrency(newPrice)} × ${targetProfitPct}%)<br>
                        Target cost = ${formatCurrency(newPrice)} - ${formatCurrency(newPrice * targetProfitPct / 100)}<br>
                        <strong>Target cost = ${formatCurrency(targetCostA)}</strong><br><br>
                        
                        <strong>b. Target cost to maintain same income level:</strong><br>
                        Current operating income = ${formatNumber(currentSalesVolume)} × (${formatCurrency(currentPrice)} - ${formatCurrency(currentCost)})<br>
                        = ${formatNumber(currentSalesVolume)} × ${formatCurrency(currentPrice - currentCost)}<br>
                        = ${formatCurrency(currentIncome)}<br><br>
                        
                        Estimated sales revenue at new price = ${formatNumber(currentSalesVolume)} × ${formatCurrency(newPrice)} = ${formatCurrency(newRevenue)}<br><br>
                        
                        Target cost per unit = (${formatCurrency(newRevenue)} - ${formatCurrency(currentIncome)}) / ${formatNumber(currentSalesVolume)}<br>
                        = ${formatCurrency(newRevenue - currentIncome)} / ${formatNumber(currentSalesVolume)}<br>
                        <strong>Target cost per unit = ${formatCurrency(targetCostB)}</strong>`
                    };
                }
            }
        ];

        function generateExam() {
            answersVisible = false;
            currentExamData = {};
            
            const container = document.getElementById('examContent');
            let html = '';
            
            questions.forEach((q, index) => {
                const data = q.generate();
                
                if (q.type === 'conceptual' || q.type === 'calculation') {
                    html += `
                        <div class="question">
                            <span class="question-number">${index + 1}.</span>
                            <div class="question-text">${data.question}</div>
                            <div class="options">
                    `;
                    
                    data.options.forEach((opt, optIndex) => {
                        const letter = String.fromCharCode(65 + optIndex);
                        html += `
                            <label class="option" id="q${index}_opt${optIndex}">
                                <input type="radio" name="q${index}" value="${optIndex}" data-correct="${opt.correct}" onclick="selectOption(${index}, ${optIndex})">
                                <span class="option-text"><strong>${letter}.</strong> ${opt.text}</span>
                            </label>
                        `;
                    });
                    
                    const correctLetter = String.fromCharCode(65 + data.options.findIndex(o => o.correct));
                    html += `
                            </div>
                            <div class="answer" id="answer${index}">
                                <span class="answer-label">✓ Correct Answer: ${correctLetter}</span>
                                <div class="explanation">${data.explanation}</div>
                            </div>
                        </div>
                    `;
                } else {
                    // Short answer questions
                    html += `
                        <div class="question">
                            <div class="question-text">${data.question}</div>
                            <div class="answer" id="answer${index}">
                                <span class="answer-label">✓ Answer:</span>
                                <div class="explanation">${data.answer}</div>
                            </div>
                        </div>
                    `;
                }
            });
            
            container.innerHTML = html;
            
            // Add submit section after exam content
            const submitSection = document.createElement('div');
            submitSection.className = 'submit-section';
            submitSection.id = 'submitSection';
            submitSection.innerHTML = `
                <h3>Ready to Submit?</h3>
                <p>Review your answers before submitting. Once submitted, you'll see your grade and which questions you got right or wrong.</p>
                <button class="submit-btn" onclick="submitExam()">📊 Submit & Grade Exam</button>
                <div class="grade-result" id="gradeResult">
                    <div class="grade-percentage" id="gradePercentage">0%</div>
                    <div class="grade-letter" id="gradeLetter">F</div>
                    <div class="grade-details" id="gradeDetails">0/24 multiple choice correct</div>
                    <div class="unanswered-warning" id="unansweredWarning"></div>
                </div>
            `;
            container.appendChild(submitSection);
            
            document.getElementById('scoreDisplay').classList.remove('show');
        }

        function selectOption(questionIndex, optionIndex) {
            // Remove selected class from all options for this question
            const options = document.querySelectorAll(`[id^="q${questionIndex}_opt"]`);
            options.forEach(opt => opt.classList.remove('selected'));
            
            // Add selected class to chosen option
            document.getElementById(`q${questionIndex}_opt${optionIndex}`).classList.add('selected');
        }

        function submitExam() {
            let correct = 0;
            let answered = 0;
            const totalMC = 24; // Questions 1-24 are multiple choice
            
            // Grade only the multiple choice questions (first 24)
            for (let i = 0; i < totalMC; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                const options = document.querySelectorAll(`[id^="q${i}_opt"]`);
                
                // Remove previous grading styles
                options.forEach(opt => {
                    opt.classList.remove('correct', 'incorrect');
                });
                
                if (selected) {
                    answered++;
                    const isCorrect = selected.getAttribute('data-correct') === 'true';
                    const selectedLabel = selected.closest('.option');
                    
                    if (isCorrect) {
                        correct++;
                        selectedLabel.classList.add('correct');
                    } else {
                        selectedLabel.classList.add('incorrect');
                        // Highlight the correct answer
                        options.forEach(opt => {
                            const input = opt.querySelector('input');
                            if (input && input.getAttribute('data-correct') === 'true') {
                                opt.classList.add('correct');
                            }
                        });
                    }
                } else {
                    // Question not answered - highlight correct answer
                    options.forEach(opt => {
                        const input = opt.querySelector('input');
                        if (input && input.getAttribute('data-correct') === 'true') {
                            opt.classList.add('correct');
                        }
                    });
                }
            }
            
            const percentage = Math.round((correct / totalMC) * 100);
            let letterGrade;
            
            if (percentage >= 93) letterGrade = 'A';
            else if (percentage >= 90) letterGrade = 'A-';
            else if (percentage >= 87) letterGrade = 'B+';
            else if (percentage >= 83) letterGrade = 'B';
            else if (percentage >= 80) letterGrade = 'B-';
            else if (percentage >= 77) letterGrade = 'C+';
            else if (percentage >= 73) letterGrade = 'C';
            else if (percentage >= 70) letterGrade = 'C-';
            else if (percentage >= 67) letterGrade = 'D+';
            else if (percentage >= 63) letterGrade = 'D';
            else if (percentage >= 60) letterGrade = 'D-';
            else letterGrade = 'F';
            
            // Update grade display
            document.getElementById('gradePercentage').textContent = `${percentage}%`;
            document.getElementById('gradeLetter').textContent = `Grade: ${letterGrade}`;
            document.getElementById('gradeDetails').textContent = `${correct}/${totalMC} multiple choice questions correct`;
            
            const gradeResult = document.getElementById('gradeResult');
            gradeResult.classList.remove('failing');
            if (percentage < 70) {
                gradeResult.classList.add('failing');
            }
            
            const unansweredCount = totalMC - answered;
            if (unansweredCount > 0) {
                document.getElementById('unansweredWarning').textContent = `⚠️ ${unansweredCount} question(s) left unanswered`;
            } else {
                document.getElementById('unansweredWarning').textContent = '✓ All questions answered';
            }
            
            gradeResult.classList.add('show');
            
            // Show all answers
            answersVisible = true;
            const answers = document.querySelectorAll('.answer');
            answers.forEach(answer => answer.classList.add('show'));
            
            // Scroll to grade result
            gradeResult.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function checkAnswer(input, questionIndex) {
            // Visual feedback could be added here
        }

        function toggleAnswers() {
            answersVisible = !answersVisible;
            const answers = document.querySelectorAll('.answer');
            answers.forEach(answer => {
                if (answersVisible) {
                    answer.classList.add('show');
                } else {
                    answer.classList.remove('show');
                }
            });
        }

        // Generate exam on page load
        generateExam();
    </script>
</body>
</html>
